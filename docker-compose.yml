services:
  # Serves the packwiz pack files locally so mc can resolve mods via packwiz-installer
  pack:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/pack.toml"]
      interval: 5s
      timeout: 3s
      retries: 5

  mc:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.244"
      PACKWIZ_INSTALLER_MANIFEST: "http://pack/pack.toml"

      # Memory — ajusta según tu máquina (mínimo 3G para este pack)
      MEMORY: "4G"
      JVM_XX_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1"

      # Server settings
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "0"
      ENABLE_WHITELIST: "false"
      ENFORCE_WHITELIST: "false"
      MOTD: "MSMP — Testing Server"
      ICON: ""

      # Ops — agrega tu username aquí
      OPS: ""

    volumes:
      - mc-data:/data
    depends_on:
      pack:
        condition: service_healthy

volumes:
  mc-data:
