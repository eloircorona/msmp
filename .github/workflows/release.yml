name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Release Please gestiona versión y changelog ──────────────────────────
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.major }}.${{ steps.rp.outputs.minor }}.${{ steps.rp.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Build + publicar en CurseForge cuando se crea una release ─────────────
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Export CurseForge pack
        run: packwiz curseforge export

      - name: Find exported zip
        id: zip
        run: echo "path=$(ls *.zip | head -1)" >> $GITHUB_OUTPUT

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          ZIP_PATH="${{ steps.zip.outputs.path }}"

          # IDs obtenidos de minecraft.curseforge.com/api/game/versions
          # MC 26.2 (gameVersionTypeID: 1) → 16500
          # NeoForge loader             → 10150
          METADATA=$(python3 -c "
          import json, os
          changelog = open('CHANGELOG.md').read() if os.path.exists('CHANGELOG.md') else 'See GitHub releases.'
          meta = {
            'changelog': changelog,
            'changelogType': 'markdown',
            'displayName': 'MSMP v$VERSION',
            'releaseType': 'release',
            'gameVersions': [16500, 10150]
          }
          print(json.dumps(meta))
          ")

          HTTP_STATUS=$(curl -s \
            -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$ZIP_PATH" \
            -o /tmp/cf_response.json \
            -w "%{http_code}" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")

          echo "CurseForge response (HTTP $HTTP_STATUS):"
          cat /tmp/cf_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Upload failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Attach zip to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${{ steps.zip.outputs.path }}" --clobber
